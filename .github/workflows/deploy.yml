name: Deploy CMS to CapRover

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CMS
        run: npm run build

      - name: Create deploy tarball
        run: |
          echo "Creating tarball from dist/..."
          cd dist
          tar -czf /tmp/captain-definition.tar.gz .
          cd ..
          echo "Tarball created:"
          ls -lh /tmp/captain-definition.tar.gz

      - name: Deploy to CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_APP_NAME: ${{ secrets.CAPROVER_APP_NAME }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
        run: |
          echo "=== Deploying CMS to CapRover ==="

          if [ -z "$CAPROVER_URL" ]; then
            echo "ERROR: CAPROVER_URL is empty!"
            exit 1
          fi
          if [ -z "$CAPROVER_APP_NAME" ]; then
            echo "ERROR: CAPROVER_APP_NAME is empty!"
            exit 1
          fi
          if [ -z "$CAPROVER_PASSWORD" ]; then
            echo "ERROR: CAPROVER_PASSWORD is empty!"
            exit 1
          fi

          LOGIN_RESPONSE=$(curl -sS -X POST "$CAPROVER_URL/api/v2/login" \
            -H "Content-Type: application/json" \
            -d "{\"password\": \"$CAPROVER_PASSWORD\"}")
          
          echo "Login response: $LOGIN_RESPONSE"

          TOKEN=$(echo "$LOGIN_RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['token'])")

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to get auth token!"
            exit 1
          fi

          echo "Auth token obtained"

          RESPONSE=$(curl -sS -X POST "$CAPROVER_URL/api/v2/apps/deploy" \
            -H "Authorization: Bearer $TOKEN" \
            -F "appName=$CAPROVER_APP_NAME" \
            -F "tarFile=@/tmp/captain-definition.tar.gz")

          echo "Deploy response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"status":1'; then
            echo "✅ Deploy successful!"
          else
            echo "❌ Deploy failed"
            exit 1
          fi
