name: Deploy CMS to CapRover

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CMS
        run: npm run build

      - name: Create deploy tarball
        run: |
          cd dist
          tar -czf ../captain-definition.tar.gz .
          cd ..

      - name: Deploy to CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_APP_NAME: ${{ secrets.CAPROVER_APP_NAME }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
        run: |
          echo "=== Deploying CMS to CapRover ==="
          echo "Server: $CAPROVER_URL"
          echo "App: $CAPROVER_APP_NAME"

          # Get auth token
          TOKEN=$(curl -sS -X POST "$CAPROVER_URL/api/v2/login" \
            -H "Content-Type: application/json" \
            -d "{\"password\": \"$CAPROVER_PASSWORD\"}" \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to get auth token"
            exit 1
          fi

          echo "Auth token obtained"

          # Deploy tarball
          RESPONSE=$(curl -sS -X POST "$CAPROVER_URL/api/v2/apps/deploy" \
            -H "Authorization: Bearer $TOKEN" \
            -F "appName=$CAPROVER_APP_NAME" \
            -F "tarFile=@captain-definition.tar.gz")

          echo "Deploy response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"status":1'; then
            echo "✅ Deploy successful!"
          else
            echo "❌ Deploy failed"
            exit 1
          fi
