name: Deploy CMS to CapRover

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & Build
        run: |
          set -e
          npm ci
          npm run build
          test -f dist/index.html || { echo "Build output missing!"; exit 1; }

      - name: Create deploy package
        run: |
          set -e
          rm -rf /tmp/deploy_pkg && mkdir -p /tmp/deploy_pkg
          cp -r dist/. /tmp/deploy_pkg/
          cp default.conf /tmp/deploy_pkg/
          cat > /tmp/deploy_pkg/Dockerfile <<'EOF'
          FROM nginx:alpine
          COPY default.conf /etc/nginx/conf.d/default.conf
          COPY . /usr/share/nginx/html
          EXPOSE 80
          EOF
          printf '{"schemaVersion": 2, "dockerfilePath": "./Dockerfile"}' > /tmp/deploy_pkg/captain-definition
          cd /tmp/deploy_pkg
          tar -czf /tmp/deploy.tar.gz .
          echo "Package contents:"
          tar -tzf /tmp/deploy.tar.gz | head -20
          echo "Tarball size: $(ls -lh /tmp/deploy.tar.gz | awk '{print $5}')"

      - name: Deploy to CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_APP_NAME: ${{ secrets.CAPROVER_APP_NAME }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Logging in..."
          LOGIN=$(curl -sSf --max-time 60 -X POST "$CAPROVER_URL/api/v2/login" \
            -H "Content-Type: application/json" \
            -d "{\"password\": \"$CAPROVER_PASSWORD\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['token'])")
          echo "Login OK"

          echo "Uploading deploy package to app: $CAPROVER_APP_NAME"
          RESP=$(curl -sS --max-time 120 -X POST \
            "$CAPROVER_URL/api/v2/user/apps/appData/$CAPROVER_APP_NAME/?detached=true" \
            -H "x-namespace: captain" \
            -H "x-captain-auth: $TOKEN" \
            -F "sourceFile=@/tmp/deploy.tar.gz")
          echo "CapRover response: $RESP"

          echo "$RESP" | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          if r.get('status') not in (100, 101):
              print('DEPLOY REJECTED:', r)
              sys.exit(1)
          print('Deploy accepted:', r.get('description'))
          "

      - name: Wait for CapRover build to finish
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_APP_NAME: ${{ secrets.CAPROVER_APP_NAME }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSf --max-time 60 -X POST "$CAPROVER_URL/api/v2/login" \
            -H "Content-Type: application/json" \
            -d "{\"password\": \"$CAPROVER_PASSWORD\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['token'])")

          get_state() {
            curl -sS --max-time 30 "$CAPROVER_URL/api/v2/user/apps/appData/$CAPROVER_APP_NAME/" \
              -H "x-namespace: captain" \
              -H "x-captain-auth: $TOKEN" \
              | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin).get('data') or {}
              print(d.get('isBuilding', False), d.get('isFailed', False))
          except Exception:
              print('ERR ERR')
          "
          }

          echo "Waiting for build to start..."
          STARTED=False
          for i in $(seq 1 24); do
            read IS_BUILDING IS_FAILED <<< "$(get_state)"
            echo "start-poll $i: isBuilding=$IS_BUILDING isFailed=$IS_FAILED"
            if [ "$IS_BUILDING" = "True" ]; then STARTED=True; break; fi
            sleep 5
          done

          if [ "$STARTED" != "True" ]; then
            echo "::warning::Build never signalled start; assuming quick finish"
            exit 0
          fi

          echo "Polling build status (max ~15 min)..."
          for i in $(seq 1 90); do
            read IS_BUILDING IS_FAILED <<< "$(get_state)" || { echo "poll $i: request error, retrying..."; sleep 10; continue; }
            echo "poll $i: isBuilding=$IS_BUILDING isFailed=$IS_FAILED"
            if [ "$IS_FAILED" = "True" ]; then
              echo "::error::CapRover build FAILED — check captain logs in dashboard"
              exit 1
            fi
            if [ "$IS_BUILDING" != "True" ]; then
              echo "Build finished successfully."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Timed out waiting for build status, but upload was accepted"
